vault_addr: http://127.0.0.1:8200
# For a separate, IAM-protected Cloud Run Vault service, use its HTTPS URL for
# both fields. The proxy fetches a short-lived ID token from the metadata server
# and sends it in X-Serverless-Authorization without replacing Vault's own
# Authorization header.
# vault_audience: https://vault-runtime-example.run.app
port: 8080
admin_emails:
  - me@example.com
  - gsa@gcp-project.iam.gserviceaccount.com
public_routes:
  - /.well-known/**
  - /v1/identity/oidc/provider/*/.well-known/**
  - /v1/identity/oidc/provider/*/authorize
  - /v1/identity/oidc/provider/*/token
  - /v1/identity/oidc/provider/*/userinfo
  - /ui/vault/identity/oidc/provider/*/authorize
  - /v1/auth/oidc/oidc/auth_url
  - /v1/auth/oidc/oidc/callback
  - /ui/vault/auth/*/oidc/callback
  - /v1/auth/userpass/login/**
  - /v1/sys/health
