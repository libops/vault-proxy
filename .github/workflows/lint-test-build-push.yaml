name: build-push

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
      GCLOUD_OIDC_POOL:
        required: false
      GSA:
        required: false
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify
          go mod tidy -diff

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build
        run: go build -trimpath ./...

      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: check

      - name: Exercise snapshot release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: ./coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  image-check:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        architecture:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.architecture.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build native image without credentials
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: ${{ matrix.architecture.platform }}
          provenance: false
          push: false
          tags: vault-proxy:ci-${{ matrix.architecture.suffix }}

  publish:
    if: github.event_name != 'pull_request'
    needs: [lint-test]
    uses: libops/.github/.github/workflows/build-push.yaml@main
    with:
      ref: ${{ github.sha }}
      expected-main-sha: ${{ github.ref == 'refs/heads/main' && github.sha || '' }}
      additional-gar-registry: us-docker.pkg.dev/libops-images/public
      sign: true
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets:
      GCLOUD_OIDC_POOL: ${{ secrets.GCLOUD_OIDC_POOL }}
      GSA: ${{ secrets.GSA }}
